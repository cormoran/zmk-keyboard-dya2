name: Build ZMK firmware

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Release version (leave empty to build only)"
        required: false

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.freeze.outputs.release_sha }}
    steps:
      - name: Checkout
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release != '' }}
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Freeze dependencies and push release branch
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release != '' }}
        id: freeze
        env:
          RELEASE_VERSION: ${{ inputs.release }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          west init -l config --mf west-standalone.yml
          west update --narrow
          python3 scripts/prepare-release.py "$RELEASE_VERSION" > "$RUNNER_TEMP/release-output"
          cat "$RUNNER_TEMP/release-output"
          cat "$RUNNER_TEMP/release-output" >> "$GITHUB_OUTPUT"
          git push --force-with-lease="refs/heads/release/$RELEASE_VERSION:" \
            origin "HEAD:refs/heads/release/$RELEASE_VERSION"
  build:
    needs: prepare-release
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    name: Build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.sha || github.sha }}
      - name: Cache west modules
        uses: actions/cache@v4
        continue-on-error: true
        env:
          cache_name: cache-west-modules
        with:
          path: dependencies/
          key: ${{ runner.os }}-build-${{ env.cache_name }}-${{ hashFiles('config/west*.yml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache_name }}-
      - name: Init
        run: |
          git config --global --add safe.directory ${{ github.workspace }}
          west init -l config --mf west-standalone.yml
          west update --narrow
          west zephyr-export
      - name: Build
        run: west zmk-build -d ./build -q
      - name: Copy artifacts
        shell: sh -x {0}
        run: |
          mkdir -p artifacts
          find ./build -type f -path '*/zephyr/zmk.uf2' \
          | while read -r f; do
              echo "Found: $f"
              name=$(basename "$(dirname "$(dirname "$f")")")
              mv "$f" "artifacts/${name}.uf2"
            done

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dya2
          path: artifacts
  release:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release != '' }}
    needs: [prepare-release, build]
    runs-on: ubuntu-latest
    name: Release
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.sha }}
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dya2
          path: artifacts
      - name: Create release
        run: |
          gh release create "$RELEASE_VERSION" \
            --title "DYA2 firmware $RELEASE_VERSION" \
            --generate-notes \
            --latest \
            --target "${{ needs.prepare-release.outputs.sha }}" \
            artifacts/*.uf2
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release }}
